<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="TriLayer Lab - учебный интерфейс взаимодействия HTML, CSS и JavaScript"><title>TriLayer Lab</title><link rel="stylesheet" href="src/style.css"></head>
<body><a class="skip-link" href="#main">К содержанию</a><header class="site-header"><div class="wrap"><h1>TriLayer Lab</h1><p>HTML · CSS · JavaScript в одной среде разработки</p></div></header>
<main id="main" class="wrap"><section aria-labelledby="catalog-title"><div class="section-heading"><h2 id="catalog-title">Каталог задач</h2><output id="count" aria-live="polite"></output></div><div class="controls"><label for="search">Поиск</label><input id="search" type="search" placeholder="Название задачи"><label for="status">Статус</label><select id="status"><option value="all">Все</option><option value="planned">В планах</option><option value="progress">В работе</option><option value="done">Готово</option></select><button id="theme" type="button" aria-pressed="false">Тёмная тема</button></div><div id="cards" class="cards" aria-live="polite"></div><p id="empty" hidden>Задач не найдено</p></section>
<section class="form-panel" aria-labelledby="form-title"><h2 id="form-title">Добавить задачу</h2><form id="task-form"><label for="title">Название задачи</label><input id="title" name="title" required minlength="3" maxlength="70"><label for="description">Описание</label><textarea id="description" name="description" minlength="8" maxlength="240" required rows="3"></textarea><label for="new-status">Статус</label><select id="new-status" name="status"><option value="planned">В планах</option><option value="progress">В работе</option><option value="done">Готово</option></select><button type="submit">Добавить</button><output id="message" role="status" aria-live="polite"></output></form></section></main><footer class="wrap">Учебный проект · 2026</footer><script type="module" src="src/app.js"></script></body></html>
